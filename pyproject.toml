[project]
name = "vp2-weather"
version = "0.2.0"
description = "Davis Vantage Pro 2 console reader and Weather Underground uploader, joined by a Weather Report JSONL pipeline"
requires-python = ">=3.12"
dependencies = [
    "requests>=2.31",
    "pyserial>=3.5",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/weather_report", "src/vantage_reader", "src/wu_uploader"]
